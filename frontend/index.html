<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Şantiye Net Hesap Sistemi — Yapay zeka destekli, sıfır hatalı dijital hesap defteri." />
  <title>Şantiye Net Hesap</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>

<!-- ===== SIDEBAR: Geçmiş Hesaplar ===== -->
<aside id="sidebar" class="sidebar" aria-label="Geçmiş hesaplar">
  <div class="sidebar-header">
    <span class="sidebar-logo">🏗️</span>
    <h1 class="sidebar-title">Şantiye Net</h1>
    <button id="btn-new-table" class="btn btn-primary btn-full" title="Yeni hesap başlat">
      + Yeni Hesap
    </button>
  </div>
  <div class="sidebar-body">
    <p class="sidebar-label">Kayıtlı Hesaplar</p>
    <ul id="history-list" class="history-list">
      <li class="history-empty">Henüz kayıtlı hesap yok.</li>
    </ul>
  </div>
</aside>

<!-- ===== HAMBURGer TOGGLE (mobil) ===== -->
<button id="btn-sidebar-toggle" class="sidebar-toggle" aria-label="Menüyü aç/kapat">☰</button>

<!-- ===== ANA İÇERİK ===== -->
<main id="main" class="main">
  
  <!-- ===== YAZDIRMA BAŞLIĞI (sadece print'te görünür) ===== -->
  <div id="print-header" class="print-header">
    <h1 id="print-title-text">Şantiye Hesap Dökümü</h1>
    <p id="print-date"></p>
  </div>

  <!-- PROMPT EKRANI -->
  <section id="screen-prompt" class="screen active">
    <div class="prompt-card">
      <div class="prompt-header">
        <h2 class="prompt-title">📋 Hesabı Anlatın</h2>
        <p class="prompt-subtitle">Düz yazı olarak anlatın — yapay zeka tabloya dönüştürsün.</p>
      </div>
      <textarea
        id="input-raw-text"
        class="prompt-textarea"
        placeholder="Örnek: Bugün 50 metrekare fayans serildi, m2'si 200 liradan. 10 torba çimento alındı, torbası 50 lira. Usta Ahmet'e 3 günlük yevmiye 1500 liradan ödendi..."
        rows="8"
        maxlength="5000"
      ></textarea>
      <div class="prompt-footer" style="flex-wrap: wrap;">
        <span id="char-count" class="char-count" style="width: 100%; margin-bottom: 8px;">0 / 5000</span>
        <div style="display: flex; gap: 8px; align-items: stretch; width: 100%; flex-direction: column;">
          <input type="file" id="input-image" accept="image/jpeg, image/png, image/jpg" style="display:none;" />
          <label for="input-image" id="btn-upload-image" class="btn btn-outline" style="cursor: pointer; justify-content: center;">
            <span id="image-name">📷 Fotoğraf Yükle</span>
          </label>
          <button id="btn-generate" class="btn btn-primary btn-lg" disabled>
            <span id="btn-generate-text">Tabloya Dönüştür →</span>
            <span id="btn-generate-loader" class="loader hidden"></span>
          </button>
        </div>
      </div>
      <div id="prompt-error" class="alert alert-error hidden"></div>
    </div>
  </section>

  <!-- TABLO EKRANI -->
  <section id="screen-table" class="screen hidden">
    <div class="table-toolbar">
      <div class="toolbar-left">
        <button id="btn-back" class="btn btn-ghost">← Geri</button>
        <input id="input-title" type="text" class="title-input" placeholder="Hesap başlığı..." maxlength="255" />
      </div>
      <div class="toolbar-right">
        <button id="btn-add-column" class="btn btn-outline">+ Sütun</button>
        <button id="btn-add-row" class="btn btn-outline">+ Satır</button>
        <button id="btn-save" class="btn btn-success">💾 Kaydet</button>
        <button id="btn-excel" class="btn btn-success">📊 Excel İndir</button>
        <button id="btn-print" class="btn btn-outline">🖨️ PDF / Yazdır</button>
      </div>
      
      <!-- AI Chat Kutusunu Ekle -->
      <div class="ai-chat-box" style="margin-top: 16px; display: flex; gap: 8px;">
        <input type="text" id="input-ai-chat" class="input-title" style="flex: 1; padding: 12px; font-size: 14px;" placeholder="Örn: Seramik fiyatına %20 zam yap..." />
        <button id="btn-ai-chat" class="btn btn-primary">
          <span id="btn-ai-chat-text">✨ Tabloyu Güncelle</span>
          <span id="btn-ai-chat-loader" class="loader hidden" style="width: 16px; height: 16px; border-width: 2px;"></span>
        </button>
      </div>

    </div>

    <div id="save-status" class="save-status hidden"></div>
    <div id="table-error" class="alert alert-error hidden"></div>

    <div class="table-wrapper">
      <table id="hakedis-table" class="hakedis-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
        <tfoot id="table-foot"></tfoot>
      </table>
    </div>
  </section>

</main>



  <!-- Uygulama Skriptleri -->
  <script src="numpad.js?v=7"></script>
  <script src="app.js?v=7"></script>
<script>
  // PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW failed:', err));
    });
  }
</script>

</body>
</html>
